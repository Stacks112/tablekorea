/* ================= state ================= */
let LANG = "EN";
let fParty = "any";
let fTags = new Set();
let selected = null;
let compare = [];

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const T = () => I18N[LANG];
const won = n => "₩".repeat(n);
const waitLabel = w => w === "low" ? T().wait_low : w === "med" ? T().wait_med : w === "high" ? T().wait_high : T().unverified;
const resLabel = r => r === "catchtable" ? "Catchtable Global" : r === "phone" ? T().bdg_phone : r === "walkin" ? T().act_walk : T().unverified;
const totalReviews = p => p.reviews ? p.reviews.naver + p.reviews.kakao + p.reviews.catch : 0;
const naverUrl = p => "https://map.naver.com/p/search/" + encodeURIComponent(p.kr.includes("성수") ? p.kr : p.kr + " 성수동");

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2600);
}

function matches(p) {
  if (fParty !== "any") {
    const need = fParty === "group" ? "group" : Number(fParty);
    if (!p.party.includes(need)) return false;
  }
  for (const t of fTags) {
    if (t === "engmenu") { if (!p.engMenu) return false; }
    else if (t === "card") { if (!p.cardOk) return false; }
    else if (t === "nowait") { if (p.wait !== "low") return false; }
    else if (t === "late") { if (!p.late) return false; }
    else if (!p.tags.includes(t)) return false;
  }
  return true;
}

/* ================= map ================= */
const B = { latMin: 37.5395, latMax: 37.5480, lngMin: 127.0465, lngMax: 127.0600 };
const MW = 448, MH = 250;
const X = lng => (lng - B.lngMin) / (B.lngMax - B.lngMin) * MW;
const Y = lat => MH - (lat - B.latMin) / (B.latMax - B.latMin) * MH;

function drawMap() {
  const svg = $("#map");
  const road = (x1,y1,x2,y2,w) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--map-road)" stroke-width="${w}" stroke-linecap="round"/>`;
  let h = "";
  h += `<rect x="0" y="40" width="60" height="180" rx="14" fill="var(--map-park)"/>`;
  h += `<text x="30" y="132" text-anchor="middle" class="maplabel">← Seoul</text>`;
  h += `<text x="30" y="145" text-anchor="middle" class="maplabel">Forest</text>`;
  h += `<rect x="0" y="234" width="${MW}" height="16" fill="var(--map-water)"/>`;
  h += road(0, 210, MW, 198, 13);
  h += road(96, 0, 88, 250, 10);
  h += road(0, 78, MW, 66, 9);
  h += road(150, 250, 168, 0, 8);
  h += road(150, 172, 448, 158, 8);
  h += road(280, 250, 292, 0, 7);
  h += road(370, 250, 378, 0, 6);
  h += road(96, 120, 448, 112, 6);
  const tx = X(127.0479), ty = Y(37.5472);
  const sx = X(127.0560), sy = Y(37.5446);
  h += `<g><rect x="${(tx-5).toFixed(1)}" y="${(ty-5).toFixed(1)}" width="10" height="10" rx="2" fill="#2d9d54"/><text x="${(tx+10).toFixed(1)}" y="${(ty+4).toFixed(1)}" class="stlabel">Ttukseom Stn (2)</text></g>`;
  h += `<g><rect x="${(sx-5).toFixed(1)}" y="${(sy-5).toFixed(1)}" width="10" height="10" rx="2" fill="#2d9d54"/><text x="${(sx-10).toFixed(1)}" y="${(sy-8).toFixed(1)}" class="stlabel" text-anchor="end">Seongsu Stn (2)</text></g>`;
  svg.innerHTML = h + `<g id="pins"></g>`;
  drawPins();
}

function drawPins() {
  const g = $("#pins");
  let h = "";
  PLACES.forEach((p, i) => {
    const ok = matches(p);
    const sel = selected === p.id;
    const x = X(p.lng).toFixed(1), y = Y(p.lat).toFixed(1);
    const r = sel ? 11 : 9;
    h += `<g class="pin ${ok ? "" : "dim"} ${sel ? "sel" : ""}" data-id="${p.id}">
      <circle cx="${x}" cy="${y}" r="16" fill="transparent"/>
      <circle class="dot" cx="${x}" cy="${y}" r="${r}"/>
      <text x="${x}" y="${Number(y)+3.4}">${i+1}</text>
    </g>`;
  });
  g.innerHTML = h;
  g.querySelectorAll(".pin").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-id");
      selected = selected === id ? null : id;
      render();
      if (selected) {
        const card = document.getElementById("card-" + id);
        if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });
  });
}

/* ================= cards ================= */
function badgeRow(p) {
  const t = T();
  const b = [];
  if (p.price) b.push(`<span class="bdg b-gray">${won(p.price)}</span>`);
  if (p.engMenu === true) b.push(`<span class="bdg b-blue">${t.bdg_en}</span>`);
  if (p.cardOk === true) b.push(`<span class="bdg b-green">${t.bdg_card}</span>`);
  if (p.cardOk === false) b.push(`<span class="bdg b-amber">${t.bdg_cash}</span>`);
  if (p.late === true) b.push(`<span class="bdg b-gray">${t.bdg_late}</span>`);
  if (p.wait === "high") b.push(`<span class="bdg b-amber">${t.bdg_wait}</span>`);
  if (p.reserve === "catchtable") b.push(`<span class="bdg b-brand">${t.bdg_book}</span>`);
  if (p.reserve === "phone") b.push(`<span class="bdg b-amber">${t.bdg_phone}</span>`);
  return b.join("");
}

function renderCards() {
  const t = T();
  const wrap = $("#cards");
  const shown = PLACES.filter(matches);
  $("#list-n").textContent = t.n_of(shown.length, PLACES.length);
  $("#list-title").textContent = (fParty === "any" && fTags.size === 0) ? t.title_all : t.title_match;
  wrap.textContent = "";
  if (shown.length === 0) {
    const d = document.createElement("div");
    d.className = "empty";
    d.innerHTML = t.empty;
    wrap.appendChild(d);
    return;
  }
  shown.forEach(p => {
    const idx = PLACES.indexOf(p) + 1;
    const card = document.createElement("div");
    card.className = "card" + (selected === p.id ? " sel" : "");
    card.id = "card-" + p.id;
    const inCmp = compare.includes(p.id);
    card.innerHTML = `
      <div class="card-top">
        <div>
          <h3>${idx}. ${p.en}<span class="kr">${p.kr}</span></h3>
          <div class="meta">${p.cat}${p.wait ? ` · <b>${waitLabel(p.wait)}</b> ${t.wait_word}` : ""}</div>
        </div>
        <div class="score">
          ${p.rating != null
            ? `<div class="val">★ ${p.rating.toFixed(1)}</div><div class="src">${totalReviews(p).toLocaleString()} reviews</div>`
            : `<div class="val">📖</div><div class="src">${t.reviews_src(p.sources ? p.sources.length : 1)}</div>`}
        </div>
      </div>
      <div class="badges">${badgeRow(p)}</div>
      <div class="summ"><span class="ai">${t.ai_label}</span><br>${p.sum.dish}</div>
      <div class="card-actions">
        <button class="btn btn-primary" data-a="detail">${t.btn_detail}</button>
        <button class="btn btn-cmp ${inCmp ? "on" : ""}" data-a="cmp" aria-label="Add to compare">⇄</button>
      </div>`;
    card.addEventListener("click", e => {
      const a = e.target.getAttribute && e.target.getAttribute("data-a");
      if (a === "cmp") { e.stopPropagation(); toggleCompare(p.id); return; }
      openDetail(p.id);
    });
    wrap.appendChild(card);
  });
}

/* ================= compare ================= */
function toggleCompare(id) {
  if (compare.includes(id)) compare = compare.filter(x => x !== id);
  else {
    if (compare.length >= 3) { toast(T().t_max3); return; }
    compare.push(id);
  }
  renderCompareBar();
  renderCards();
}
function renderCompareBar() {
  const bar = $("#cmp-bar");
  if (compare.length === 0) { bar.classList.remove("show"); return; }
  bar.classList.add("show");
  $("#cmp-t").textContent = T().cmp_t(compare.length);
  $("#cmp-s").textContent = compare.map(id => PLACES.find(p => p.id === id).en).join(" · ");
}
function openCompare() {
  const t = T();
  if (compare.length < 2) { toast(t.t_min2); return; }
  const ps = compare.map(id => PLACES.find(p => p.id === id));
  const row = (label, fn) => `<tr><td>${label}</td>${ps.map(p => `<td>${fn(p)}</td>`).join("")}</tr>`;
  const html = `
    <h2>${t.cmp_title}</h2>
    <table class="cmp-table">
      <tr><th></th>${ps.map(p => `<th><span class="name-cell">${p.en}</span></th>`).join("")}</tr>
      ${row(t.r_rating, p => p.rating != null ? `★ ${p.rating.toFixed(1)} <span style="color:var(--ink-3)">(${totalReviews(p).toLocaleString()})</span>` : `<span class="no">—</span>`)}
      ${row(t.r_price, p => p.price ? won(p.price) : `<span class="no">—</span>`)}
      ${row(t.r_wait, p => waitLabel(p.wait))}
      ${row(t.r_book, p => resLabel(p.reserve))}
      ${row(t.r_en, p => p.engMenu === true ? `<span class="yes">${t.yes}</span>` : p.engMenu === false ? `<span class="no">${t.no}</span>` : `<span class="no">—</span>`)}
      ${row(t.r_card, p => p.cardOk === true ? `<span class="yes">${t.ok}</span>` : p.cardOk === false ? `<span class="no">${t.cash}</span>` : `<span class="no">—</span>`)}
      ${row(t.r_late, p => p.late === true ? `<span class="yes">${t.yes}</span>` : p.late === false ? `<span class="no">${t.no}</span>` : `<span class="no">—</span>`)}
      ${row(t.r_best, p => p.party.map(x => x === "group" ? t.grp : x).join(", ") + " " + t.ppl)}
      ${row(t.r_one, p => `<span style="font-size:11.5px">${p.sum.vibe}</span>`)}
    </table>
    <div class="act-col">
      <button class="act act-g" id="cmp-close"><div>${t.close}</div><span class="arr">✕</span></button>
    </div>`;
  openSheet(html);
  $("#cmp-close").addEventListener("click", closeSheet);
}

/* ================= detail ================= */
function openDetail(id) {
  const t = T();
  const p = PLACES.find(x => x.id === id);
  if (!p) return;
  selected = id;
  render();
  const html = `
    <h2>${p.en} <span class="kr2">${p.kr}</span></h2>
    <div class="meta" style="margin-top:2px">${p.cat}${p.price ? ` · ${won(p.price)}` : ""}</div>
    ${p.addr ? `<div class="meta">📍 ${p.addr}</div>` : ""}
    ${p.rating != null ? `<div class="rating-row">
      <div class="rt"><div class="v">★ ${p.rating.toFixed(1)}</div><div class="l">${t.blended}</div></div>
      <div class="rt"><div class="v">${p.reviews.naver.toLocaleString()}</div><div class="l">Naver</div></div>
      <div class="rt"><div class="v">${p.reviews.kakao.toLocaleString()}</div><div class="l">Kakao</div></div>
      <div class="rt"><div class="v">${p.reviews.catch.toLocaleString()}</div><div class="l">Catchtable</div></div>
    </div>` : `<div class="ai-note" style="margin:10px 0 12px">${t.rev_soon}</div>`}
    <div class="ai-box">
      <div class="ai-t">${t.ai_t}</div>
      <ul>
        <li class="dish">${p.sum.dish}</li>
        <li class="vibe">${p.sum.vibe}</li>
        <li class="wait">${p.sum.wait}</li>
        <li class="tip">${p.sum.tip}</li>
      </ul>
      <div class="ai-src">${t.ai_src}</div>
      ${t.ai_note ? `<div class="ai-note">${t.ai_note}</div>` : ""}
    </div>
    ${p.sources && p.sources.length ? `<div class="sec-t">${t.srcs}</div>
    <div class="src-links">${p.sources.map(s => `<a href="${s.u}" target="_blank" rel="noopener">${s.n} ↗</a>`).join("")}</div>` : ""}
    <div class="sec-t">${t.good}</div>
    <div class="info-grid">
      <div class="ig"><div class="l">${t.g_en}</div><div class="v">${p.engMenu === true ? t.v_en_y : p.engMenu === false ? t.v_en_n : t.unverified}</div></div>
      <div class="ig"><div class="l">${t.g_card}</div><div class="v">${p.cardOk === true ? t.v_card_y : p.cardOk === false ? t.v_card_n : t.unverified}</div></div>
      <div class="ig"><div class="l">${t.g_wait}</div><div class="v">${waitLabel(p.wait)}</div></div>
      <div class="ig"><div class="l">${t.g_best}</div><div class="v">${p.party.map(x => x === "group" ? t.groups : x + " " + t.ppl).join(" · ")}</div></div>
    </div>
    <div class="act-col">
      ${p.reserve === "catchtable"
        ? `<button class="act act-res" data-act="book"><div>${t.act_book}<span class="sub">${t.act_book_s}</span></div><span class="arr">›</span></button>`
        : p.reserve === "phone"
        ? `<button class="act act-res" data-act="phone"><div>${t.act_phone}<span class="sub">${t.act_phone_s}</span></div><span class="arr">›</span></button>`
        : p.reserve === "walkin"
        ? `<button class="act act-res" data-act="walkin"><div>${t.act_walk}<span class="sub">${t.act_walk_s}</span></div><span class="arr">›</span></button>`
        : `<button class="act act-res" data-act="naverlink"><div>${t.act_check}<span class="sub">${t.act_check_s}</span></div><span class="arr">›</span></button>`}
      <button class="act act-g" data-act="google"><div>${t.act_google}<span class="sub">${t.act_google_s}</span></div><span class="arr">›</span></button>
    </div>`;
  openSheet(html);
  $("#sheet-body").querySelectorAll("[data-act]").forEach(b => {
    b.addEventListener("click", () => {
      const a = b.getAttribute("data-act");
      if (a === "book") toast(t.t_book);
      else if (a === "phone") toast(t.t_phone);
      else if (a === "walkin") toast(t.t_walk);
      else if (a === "naverlink") window.open(naverUrl(p), "_blank");
      else if (a === "google") window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.kr + " " + (p.addr || ""))}`, "_blank");
    });
  });
}

/* ================= sheet ================= */
function openSheet(html) {
  $("#sheet-body").innerHTML = html;
  $("#overlay").classList.add("show");
  $("#sheet").classList.add("show");
}
function closeSheet() {
  $("#overlay").classList.remove("show");
  $("#sheet").classList.remove("show");
}
$("#overlay").addEventListener("click", closeSheet);

/* ================= static i18n ================= */
function applyStatic() {
  const t = T();
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    if (typeof t[k] === "string") el.textContent = t[k];
  });
  document.documentElement.lang = LANG === "EN" ? "en" : LANG === "JA" ? "ja" : "zh-Hant";
}

/* ================= events ================= */
$("#f-party").addEventListener("click", e => {
  const v = e.target.getAttribute && e.target.getAttribute("data-v");
  if (!v) return;
  fParty = v;
  $("#f-party").querySelectorAll(".chip").forEach(c => c.classList.toggle("on-dark", c.getAttribute("data-v") === v));
  render();
});
$("#f-tags").addEventListener("click", e => {
  const v = e.target.getAttribute && e.target.getAttribute("data-v");
  if (!v) return;
  if (fTags.has(v)) fTags.delete(v); else fTags.add(v);
  e.target.classList.toggle("on");
  render();
});
$("#lang").addEventListener("click", e => {
  const l = e.target.getAttribute && e.target.getAttribute("data-l");
  if (!l || l === LANG) return;
  LANG = l;
  $("#lang").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.getAttribute("data-l") === l));
  applyStatic();
  render();
  if ($("#sheet").classList.contains("show")) closeSheet();
});
$("#cmp-go").addEventListener("click", openCompare);

/* ================= boot ================= */
function render() { drawPins(); renderCards(); renderCompareBar(); }
applyStatic();
drawMap();
render();
/* deep link: /?place=p4 opens that venue (used by static SEO pages) */
const qp = new URLSearchParams(location.search).get("place");
if (qp && PLACES.some(p => p.id === qp)) openDetail(qp);
</script>
