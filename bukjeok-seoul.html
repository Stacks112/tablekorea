<!doctype html><html lang="ko" data-theme="dark"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>북적북적 서울 — 서울 120곳 실시간 인파</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--lv1:#2dd4bf;--lv2:#facc15;--lv3:#fb923c;--lv4:#f43f5e;
--glass:#0e1626;--line:rgba(148,197,255,.14);--tx:#e8f1ff;--dim:#8ea8c9;--bg:#070d17;
--mapbg:#0a1322;--field:#0a1220;--panel2:#0b1424;--toastbg:#0f1728;
--headgrad:linear-gradient(180deg,rgba(7,13,23,.92),rgba(7,13,23,.55) 75%,transparent);
--aura-op:.5;--acc:#7dd3fc;--acc2:#a5b4fc;--h3:#9fc3ec}
:root[data-theme="light"]{--lv1:#0d9488;--lv2:#d97706;--lv3:#ea580c;--lv4:#e11d48;
--glass:#fff;--line:rgba(30,64,120,.14);--tx:#0f2137;--dim:#5b7391;--bg:#eef4fb;
--mapbg:#a8dbee;--field:#fff;--panel2:#f0f6fd;--toastbg:#fff;
--headgrad:linear-gradient(180deg,rgba(238,244,251,.94),rgba(238,244,251,.6) 75%,transparent);
--aura-op:.3;--acc:#0284c7;--acc2:#4f46e5;--h3:#33587d}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
background:var(--bg);color:var(--tx);overflow:hidden;transition:background .35s,color .35s}
#map{position:fixed;inset:0;background:var(--mapbg)}
.leaflet-container{background:var(--mapbg);font:inherit}
:root[data-theme="light"] .leaflet-tile{filter:saturate(1.35)}
.aura{position:fixed;pointer-events:none;border-radius:50%;filter:blur(70px);z-index:400;opacity:var(--aura-op)}
.aura.a{width:44vmax;height:44vmax;left:-12vmax;top:-14vmax;
background:radial-gradient(circle,rgba(34,211,238,.16),transparent 65%);animation:drift 16s ease-in-out infinite}
.aura.b{width:38vmax;height:38vmax;right:-10vmax;bottom:-12vmax;
background:radial-gradient(circle,rgba(99,102,241,.15),transparent 65%);animation:drift 20s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate(4vmax,3vmax) scale(1.07)}}
header{position:fixed;top:0;left:0;right:0;z-index:900;display:flex;align-items:center;gap:14px;
flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--headgrad);pointer-events:none}
header>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand h1{font-size:17px;font-weight:800;letter-spacing:-.3px}
.brand small{display:block;font-size:10.5px;font-weight:500;color:var(--dim);letter-spacing:.2px}
#city-switch{display:inline-flex;gap:2px;margin-left:8px;padding:2px;border-radius:999px;
vertical-align:2px;background:rgba(148,197,255,.13);border:1px solid var(--line)}
#city-switch .cs{padding:2.5px 10px;border-radius:999px;font-size:11.5px;font-weight:800;
letter-spacing:-.2px;color:var(--dim);text-decoration:none;transition:.15s;cursor:pointer;border:0;background:none;font-family:inherit}
#city-switch .cs.on{background:linear-gradient(135deg,rgba(45,212,191,.32),rgba(99,102,241,.26));color:var(--tx)}
#lang-switch{display:inline-flex;gap:2px;padding:2px;border-radius:999px;
background:rgba(148,197,255,.13);border:1px solid var(--line)}
#lang-switch .ls{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;
letter-spacing:-.2px;color:var(--dim);cursor:pointer;border:0;background:none;font-family:inherit;transition:.15s}
#lang-switch .ls.on{background:linear-gradient(135deg,rgba(45,212,191,.32),rgba(99,102,241,.26));color:var(--tx)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:11.5px;
font-weight:700;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);
color:var(--tx);font-family:inherit;cursor:default}
.chip i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
#refresh-chip,#theme-chip{cursor:pointer;transition:.2s}
#refresh-chip:hover,#theme-chip:hover{border-color:rgba(45,212,191,.5)}
aside{position:fixed;z-index:900;top:74px;left:14px;bottom:14px;width:330px;max-width:calc(100vw - 28px);
transition:transform .35s cubic-bezier(.2,.8,.25,1);display:flex;flex-direction:column;border-radius:20px;
overflow:hidden;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);
box-shadow:0 24px 70px -30px rgba(0,0,0,.8)}
aside.hidden{transform:translateX(calc(-100% - 20px))}
.searchbox{padding:12px;border-bottom:1px solid var(--line)}
.searchbox form{display:flex;gap:8px}
.searchbox input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
background:var(--field);color:var(--tx);font-size:13.5px;outline:none;transition:.2s;font-family:inherit}
.searchbox input:focus{border-color:rgba(45,212,191,.55);box-shadow:0 0 0 3px rgba(45,212,191,.12)}
.searchbox button{padding:0 16px;border:1px solid rgba(45,212,191,.45);border-radius:12px;font-weight:800;
font-size:13px;color:var(--tx);cursor:pointer;font-family:inherit;
background:linear-gradient(135deg,rgba(45,212,191,.22),rgba(99,102,241,.2));transition:.15s}
.searchbox button:active{transform:scale(.95)}
#search-note{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5;min-height:16px}
#search-note b{color:var(--acc)}
.seg{display:flex;gap:4px;margin-top:8px}
.seg button{flex:1;padding:6px 0;border-radius:9px;border:1px solid var(--line);background:transparent;
color:var(--dim);font-size:11px;font-weight:800;cursor:pointer;transition:.15s;font-family:inherit}
.seg button.on{background:linear-gradient(135deg,rgba(45,212,191,.22),rgba(99,102,241,.2));
color:var(--tx);border-color:rgba(45,212,191,.45)}
.seg button:disabled{opacity:.35;cursor:default}
.foodtogglechip{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
border:1px solid rgba(45,212,191,.3);background:var(--field);color:var(--tx);font-size:11px;font-weight:700;
cursor:pointer;font-family:inherit;white-space:nowrap;margin-top:8px}
.foodtogglechip.on{background:linear-gradient(135deg,rgba(45,212,191,.32),rgba(99,102,241,.26));border-color:rgba(45,212,191,.55)}
.foodbadge{font-size:10px;font-weight:800;color:var(--lv1);background:rgba(148,197,255,.14);
padding:2px 7px;border-radius:999px;flex:0 0 auto;white-space:nowrap}
#calmstrip{padding:9px 12px 4px;border-bottom:1px solid var(--line)}
#calmstrip .cap{font-size:10.5px;font-weight:800;color:var(--lv1);margin-bottom:7px;letter-spacing:.3px}
#calmstrip .chips2{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}
#calmstrip .chips2::-webkit-scrollbar{display:none}
#calmstrip button{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
border:1px solid rgba(45,212,191,.3);background:var(--field);color:var(--tx);font-size:11px;font-weight:700;
cursor:pointer;font-family:inherit;white-space:nowrap}
#calmstrip button i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
#arealist{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px}
#arealist::-webkit-scrollbar{width:4px}
#arealist::-webkit-scrollbar-thumb{background:rgba(148,197,255,.25);border-radius:4px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;
transition:.15s;border:1px solid transparent}
.row:hover{background:rgba(45,212,191,.07);border-color:rgba(45,212,191,.18)}
.row .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 10px currentColor}
.row .nm{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{display:block;font-size:10.5px;color:var(--dim);font-weight:500}
.row .lv{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;flex:0 0 auto}
.row .km{font-size:11px;color:var(--acc);font-weight:700;flex:0 0 auto;width:52px;text-align:right}
#panel-hide{flex:0 0 auto;width:38px;height:38px;align-self:center;border-radius:50%;border:0;
background:rgba(148,197,255,.16);color:var(--dim);font-size:15px;font-weight:600;cursor:pointer;
display:inline-flex;align-items:center;justify-content:center;transition:.15s;font-family:inherit}
#panel-show{position:fixed;z-index:899;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));display:none;
align-items:center;gap:7px;padding:13px 19px;border-radius:999px;overflow:hidden;
border:1px solid rgba(45,212,191,.5);color:var(--tx);font-size:13px;font-weight:900;cursor:pointer;
background:linear-gradient(135deg,rgba(45,212,191,.28),rgba(99,102,241,.24)),var(--glass);
box-shadow:0 10px 30px -12px rgba(45,212,191,.6);font-family:inherit}
#panel-show.on{display:inline-flex}
#drawer{position:fixed;z-index:950;top:74px;right:14px;bottom:14px;width:390px;max-width:calc(100vw - 28px);
border-radius:20px;overflow:hidden;display:flex;flex-direction:column;background:var(--glass);
border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 24px 70px -30px rgba(0,0,0,.85);
transform:translateX(calc(100% + 20px));transition:transform .35s cubic-bezier(.2,.8,.25,1)}
#drawer.open{transform:none}
#drawer-head{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
#drawer-head h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
#drawer-head .cat{font-size:11px;color:var(--dim);font-weight:600;margin-top:3px}
#d-close{width:30px;height:30px;border-radius:50%;border:0;background:rgba(148,197,255,.1);
color:var(--dim);font-size:15px;cursor:pointer;flex:0 0 auto;font-family:inherit}
#drawer-body{flex:1;overflow-y:auto;padding:14px 16px 20px}
#drawer-body::-webkit-scrollbar{width:4px}
#drawer-body::-webkit-scrollbar-thumb{background:rgba(148,197,255,.25);border-radius:4px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;font-weight:800;font-size:13.5px}
.badge i{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor;
animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
#d-msg{font-size:12.5px;color:var(--dim);line-height:1.65;margin:10px 0 4px;word-break:keep-all}
#d-msg b{color:var(--tx)}
.sec{margin-top:18px}
.sec h3{font-size:12px;font-weight:800;color:var(--h3);letter-spacing:.4px;margin-bottom:10px;
display:flex;align-items:center;gap:7px}
.sec h3::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(#2dd4bf,#818cf8)}
#besttime{margin:2px 0 10px}
.bt{display:block;padding:10px 14px;border-radius:12px;font-size:12.5px;font-weight:600;line-height:1.65;
word-break:keep-all;background:linear-gradient(135deg,rgba(45,212,191,.16),rgba(56,189,248,.14));
border:1px solid rgba(45,212,191,.35);color:var(--tx)}
.bt b{color:var(--lv1);font-weight:800}
#chart{width:100%;height:150px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:block}
.chart-cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:6px}
.chart-cap b{color:var(--acc2)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{padding:11px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.card .kv{font-size:10.5px;color:var(--dim);font-weight:600}
.card .vv{font-size:17px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
.card .vv small{font-size:10.5px;color:var(--dim);font-weight:600}
.visitor,.gender{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-bottom:6px}
.visitor>div,.gender>div{transition:width .6s}
.glabel{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.nearby{display:flex;flex-wrap:wrap;gap:7px}
.nearby button{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;
border:1px solid var(--line);background:var(--field);color:var(--tx);font-size:11.5px;font-weight:700;
cursor:pointer;transition:.15s;font-family:inherit}
.nearby i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.nearby small{color:var(--dim);font-weight:600}
.maplinks{display:flex;gap:5px;flex:0 0 auto;margin-left:6px}
.maplinks a{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;
font-size:10px;font-weight:900;text-decoration:none;color:#fff;transition:.15s;opacity:.92}
.maplinks .ln{background:#03c75a}.maplinks .lk{background:#fee500;color:#191919}.maplinks .lt{background:#4b2ea8}
.note{font-size:10.5px;color:var(--dim);line-height:1.6;margin-top:8px}
.foodsub{font-size:10.5px;color:var(--dim);font-weight:600;margin:-4px 0 10px}
.foodstats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:var(--dim);font-weight:700}
.foodstats span{display:flex;align-items:center;gap:5px}
.foodstats i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.foodcard{margin-bottom:8px}
.fc-top{display:flex;align-items:center;gap:8px}
.fc-top .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
.fc-map{font-size:10.5px;font-weight:700;color:var(--dim);text-decoration:none;flex:0 0 auto;
padding:2px 7px;border:1px solid var(--line);border-radius:999px;transition:.15s}
.fc-map:hover{color:var(--acc);border-color:var(--acc)}
.fc-nm{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-nmgrp{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.fc-nmgrp .fc-nm{flex:0 0 auto;width:100%;white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc-nm-ko{font-size:10px;font-weight:600;color:var(--dim);line-height:1.3;user-select:text;
white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc-sub{font-size:10.5px;color:var(--dim);margin-top:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fc-comm{padding:2px 7px;border-radius:999px;background:rgba(125,211,252,.15);color:var(--acc);font-weight:700;font-size:9.5px}
.fc-menu{margin-top:7px}
.fc-ml{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:1.5px 0;color:var(--tx)}
.fc-ml.fc-more{color:var(--dim)}
.fc-mn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-mp{flex:0 0 auto;color:var(--dim);font-weight:600;white-space:nowrap}
.askblock{margin-top:7px;padding:9px 11px;border-left:3px solid var(--lv2);background:var(--field);
border-radius:0 10px 10px 0;font-size:13px;line-height:1.6;user-select:text;-webkit-user-select:text;color:var(--tx)}
.askblock .ask-cap{font-size:10.5px;font-weight:800;color:var(--lv2);margin-bottom:4px;letter-spacing:.3px}
.fc-alc{margin-top:7px;font-size:11.5px;font-weight:700;color:var(--lv3)}
.fc-foot{display:flex;justify-content:flex-end;margin-top:8px}
#foodctl{padding:9px 12px 4px;border-bottom:1px solid var(--line)}
#foodctl .chips2{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none;margin-bottom:2px}
#foodctl .chips2::-webkit-scrollbar{display:none}
#foodctl .chips2 button{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
border:1px solid rgba(45,212,191,.3);background:var(--field);color:var(--tx);font-size:11px;font-weight:700;
cursor:pointer;font-family:inherit;white-space:nowrap}
#foodctl .chips2 button.on{background:linear-gradient(135deg,rgba(45,212,191,.32),rgba(99,102,241,.26));border-color:rgba(45,212,191,.55)}
#foodlist{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px}
#foodlist::-webkit-scrollbar{width:4px}
#foodlist::-webkit-scrollbar-thumb{background:rgba(148,197,255,.25);border-radius:4px}
.fc2{padding:11px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;transition:.15s}
.fc2:hover{border-color:rgba(45,212,191,.35)}
.fc2-tiles{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:9px;scrollbar-width:none}
.fc2-tiles::-webkit-scrollbar{display:none}
.fc2-tile{flex:0 0 auto;width:112px;height:104px;border-radius:12px;background:var(--field);border:1px solid var(--line);
padding:8px 9px;display:flex;flex-direction:column;justify-content:space-between}
.fc2-tile.noprice{justify-content:center}
.fc2-tile .tn{font-size:10.5px;font-weight:600;color:var(--tx);line-height:1.35;display:-webkit-box;
-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc2-tile .tn-group{display:flex;flex-direction:column;gap:1px;overflow:hidden}
.fc2-tile .tn-tr{font-size:12px;font-weight:700;color:var(--tx);line-height:1.3;display:-webkit-box;
-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc2-tile .tn-ko{font-size:9.5px;font-weight:500;color:var(--dim);line-height:1.25;white-space:nowrap;
overflow:hidden;text-overflow:ellipsis}
.fc2-tile .tp{font-size:13px;font-weight:800;color:var(--tx)}
.askblock .ask-pair+.ask-pair{margin-top:8px}
.askblock .ask-meaning{font-size:13px;line-height:1.55}
.askblock .ask-sep{border:0;border-top:1px solid var(--line);margin:6px 0}
.askblock .ask-orig{font-size:13px;font-weight:800;line-height:1.55}
.askblock .ask-hint{font-size:10px;font-weight:600;color:var(--dim);margin-top:7px}
.fc2-top2{display:flex;align-items:center;gap:8px}
.fc2-nm{flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc2-nmgrp{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.fc2-nmgrp .fc2-nm{flex:0 0 auto;width:100%;white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc2-nm-ko{font-size:11.5px;font-weight:600;color:var(--dim);line-height:1.3;user-select:text;
white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc2-d{font-size:11px;color:var(--dim);font-weight:700;flex:0 0 auto}
.fc2-tierrow{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:11px;color:var(--dim);font-weight:600;flex-wrap:wrap}
.fc2-tierrow .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor;display:inline-block}
.fc2-crowd{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;color:var(--dim);font-weight:600}
.fc2-crowd i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.fc2-foot{display:flex;justify-content:flex-end;margin-top:8px}
.mk{position:relative}
.mk .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;
box-shadow:0 0 12px currentColor,inset 0 0 4px rgba(255,255,255,.55)}
.mk .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;
border:2px solid;opacity:.3;width:22px;height:22px}
.mk.hot .ring{opacity:.85;width:auto;height:auto;animation:ripple 1.1s ease-out infinite}
@keyframes ripple{0%{width:10px;height:10px;opacity:.8}100%{width:44px;height:44px;opacity:0}}
.mklabel{backdrop-filter:blur(8px);white-space:nowrap;opacity:.94;background:var(--glass)!important;
border:1px solid var(--line)!important;color:var(--tx)!important;border-radius:999px!important;
padding:2px 9px!important;font-size:10px!important;font-weight:700!important;
box-shadow:0 4px 14px -6px rgba(0,0,0,.5)!important}
.mklabel::before{display:none!important}
.home-mk{filter:drop-shadow(0 0 8px rgba(125,211,252,.9));font-size:22px;line-height:1}
#toast{position:fixed;z-index:1400;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));
transform:translate(-50%,80px);padding:11px 18px;border-radius:14px;background:var(--toastbg);
border:1px solid var(--line);font-size:12.5px;color:var(--tx);transition:.3s;max-width:88vw;text-align:center}
#toast.show{transform:translate(-50%,0)}

function markers(list){
  if(!HAS_MAP) return; mkLayer.clearLayers();
  list.forEach(a=>{
    const size=Math.max(10,Math.min(26,Math.sqrt((a.mx||500))/9));
    const hot=a.lv>=2;
    const ic=L.divIcon({className:'',iconSize:[size,size],html:
      `<div class="mk ${hot?'hot':''}" style="color:${LVC[a.lv]};width:${size}px;height:${size}px">
        <div class="ring" style="border-color:${LVC[a.lv]}"></div>
        <div class="core" style="width:${size}px;height:${size}px;background:${LVC[a.lv]}"></div></div>`});
    const m=L.marker([a.lat,a.lng],{icon:ic}).addTo(mkLayer);
    if(a.lv>=2) m.bindTooltip(a.nm,{permanent:true,direction:'top',className:'mklabel',offset:[0,-6]});
    m.on('click',()=>open_(a));
  });
}

function priceParts(s){
  const m=s.match(/^(.*\S)\s+([\d][\d,]*)$/);
  if(m){
    const price=parseInt(m[2].replace(/,/g,''),10);
    if(!isNaN(price)) return {name:m[1].trim(),price:price.toLocaleString()+'원'};
  }
  return {name:s,price:''};
}
function askBlockHtml(r){
  if(!r.ask || !r.ask.length) return '';
  if(lang===0){
    return `<div class="askblock"><div class="ask-cap">💬 ${T('ask_cap')}</div>${r.ask.map(k=>`<div>${FOOD.askKeys[k]||k}</div>`).join('')}</div>`;
  }
  const pairs=r.ask.map(k=>{
    const orig=FOOD.askKeys[k]||k;
    const tr=(I18N.ask[k]&&I18N.ask[k][lang])? I18N.ask[k][lang] : '';
    return `<div class="ask-pair">
      <div class="ask-meaning">${tr}</div>
      <hr class="ask-sep">
      <div class="ask-orig">${orig}</div>
    </div>`;
  }).join('');
  return `<div class="askblock"><div class="ask-cap">💬 ${T('ask_cap')}</div>${pairs}<div class="ask-hint">👆 ${T('ask_show')}</div></div>`;
}
function foodCardHtml(r){
  const tierColor = r.tier===1?'var(--lv1)':r.tier===2?'var(--lv2)':'var(--dim)';
  const kindLabel = r.kind==='cafe'?T('kind_cafe'):T('kind_soup');
  const dtxt = r.d<1000? Math.round(r.d)+'m' : (r.d/1000).toFixed(1)+'km';
  const items=r.menu||[];
  let menuHtml;
  if(items.length<=3){
    menuHtml=items.map(mi=>{const p=priceParts(mi);
      return `<div class="fc-ml"><span class="fc-mn">${p.name}</span><span class="fc-mp">${p.price}</span></div>`;}).join('');
  }else{
    menuHtml=items.slice(0,2).map(mi=>{const p=priceParts(mi);
      return `<div class="fc-ml"><span class="fc-mn">${p.name}</span><span class="fc-mp">${p.price}</span></div>`;}).join('');
    const _n=items.length-2;
    menuHtml+=`<div class="fc-ml fc-more">${lang===0?`외 ${_n}개`:lang===1?`+${_n} more`:`+${_n} lainnya`}</div>`;
  }
  const askHtml=askBlockHtml(r);
  const alcHtml = r.alc? `<div class="fc-alc">${T('alc')}</div>` : '';
  const commHtml = r.community? `<span class="fc-comm">${T('comm')}</span>` : '';
  const nm=encodeURIComponent(r.nm);
  return `<div class="card foodcard">
    <div class="fc-top"><span class="dot" style="background:${tierColor};color:${tierColor}"></span>
      ${storeNameHtml(r.nm,'fc-nm')}<span class="km" style="width:auto">${dtxt}</span></div>
    <div class="fc-sub"><span>${kindLabel}</span>${commHtml}
      <a class="fc-map" href="https://map.naver.com/p/search/${nm}" target="_blank" rel="noopener">${T('maplink')} ↗</a></div>
    <div class="fc-menu">${menuHtml}</div>
    ${askHtml}${alcHtml}
  </div>`;
}

  const showCount = foodDrawerShowAll? filtered.length : Math.min(8,filtered.length);
  const shown = filtered.slice(0,showCount);
  const cardsHtml = shown.map(foodCardHtml).join('');

  const moreBtnLabel = lang===0? `+ 나머지 ${moreN}곳 보기` : `+ ${T('more')} (${moreN} ${T('left')})`;
  const moreBtn = (filtered.length>8 && !foodDrawerShowAll) ?

      <span><i style="background:var(--lv2)"></i>${T('tier2')} ${sum.t2}</span>

      <button data-f="t2" class="${foodDrawerFilter==='t2'?'on':''}">${T('tier2')}</button>

    <div id="food-cards" style="margin-top:10px">${cardsHtml}</div>
    ${moreBtn}
    <div class="note">${T('note')}</div>`;
  sec.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    foodDrawerFilter=b.dataset.f; foodDrawerShowAll=false; buildFoodSectionInner(a);

  if(mb) mb.onclick=()=>{ foodDrawerShowAll=true; buildFoodSectionInner(a); };

function renderFoodSection(a){
  const sum=FOOD.byPoi[a.cd];
  if(!sum){ $('#food-sec').style.display='none'; $('#food-sec').innerHTML=''; return; }

/* ---- 맛집 모드 (하단 시트 1단계) ---- */
function minPrice(r){
  let m=Infinity;
  (r.menu||[]).forEach(mi=>{
    const p=priceParts(mi);
    if(p.price){ const n=parseInt(p.price.replace(/[^\d]/g,''),10); if(!isNaN(n)&&n<m) m=n; }
  });
  return m;
}
function foodFiltered(){
  let l=FOOD.rows;
  if(foodCatFilter==='cafe') l=l.filter(r=>r.kind==='cafe');
  else if(foodCatFilter==='soup') l=l.filter(r=>r.kind==='soup');
  else if(foodCatFilter==='t1') l=l.filter(r=>r.tier===1);
  else if(foodCatFilter==='noalc') l=l.filter(r=>!r.alc);
  return l.slice();
}
function foodSorted(){
  const o=origin||CENTER_SEONGSU;
  const pm={}; AREAS.forEach(a=>pm[a.cd]=a);
  const l=foodFiltered();
  l.forEach(r=>{ r._d=dist(o[0],o[1],r.lat,r.lng); });
  if(foodSortMode==='calm'){
    l.sort((x,y)=>{
      const lx=pm[x.poi]?pm[x.poi].lv:9, ly=pm[y.poi]?pm[y.poi].lv:9;
      return lx-ly || x._d-y._d;
    });
  }else if(foodSortMode==='price'){
    l.sort((x,y)=>minPrice(x)-minPrice(y));
  }else{
    l.sort((x,y)=>x._d-y._d);
  }
  return l;
}
function tileNameHtml(name){
  const tr=TM(name);
  if(tr) return `<div class="tn-group"><span class="tn tn-tr">${tr}</span><span class="tn-ko">${name}</span></div>`;
  return `<span class="tn">${name}</span>`;
}
function foodTileHtml(mi){
  const p=priceParts(mi);
  if(p.price) return `<div class="fc2-tile">${tileNameHtml(p.name)}<span class="tp">${p.price}</span></div>`;
  return `<div class="fc2-tile noprice">${tileNameHtml(p.name)}</div>`;
}
function foodCard2Html(r){
  const items=r.menu||[];
  // 타일은 가격 있는 것만, 싼 순으로. 가격이 하나도 없으면 이름만 한 줄로 접는다.
  const parsed=items.map(priceParts);
  // 술 메뉴는 뒤로 — 술을 피하려는 사용자에게 대표 메뉴로 보이면 안 된다
  const ALC=/막걸리|맥주|소주|와인|하이볼|사케|칵테일|위스키|생맥|벨리니|모히또|wine|beer|whisky|cocktail/i;
  const priced=parsed.filter(p=>p.price)
    .map(p=>({p,v:parseInt(String(p.price).replace(/[^0-9]/g,''),10)||0,a:ALC.test(p.name)?1:0}))
    .sort((a,b)=>a.a-b.a||a.v-b.v).slice(0,6).map(x=>x.p);
  let tilesHtml='';
  if(priced.length){
    tilesHtml=`<div class="fc2-tiles">${priced.map(p=>
      `<div class="fc2-tile">${tileNameHtml(p.name)}<span class="tp">${p.price}</span></div>`).join('')}</div>`;
  }else if(parsed.length){
    const names=parsed.slice(0,3).map(p=>{const t=TM(p.name);
      return t? `${t} <span class="nm-ko">${p.name}</span>` : p.name;}).join(' · ');
    const rest=parsed.length>3? (lang===0? ` 외 ${parsed.length-3}개`
      : lang===1? ` +${parsed.length-3} more` : ` +${parsed.length-3} lainnya`):'';
    tilesHtml=`<div class="fc2-nomenu"><b>${T('menu_cap')}</b> ${names}${rest}<span class="fc2-nop">${T('noprice')}</span></div>`;
  }
  const tierColor = r.tier===1?'var(--lv1)':r.tier===2?'var(--lv2)':'var(--dim)';
  const tierLabel = r.tier===1?T('tier1'):r.tier===2?T('tier2'):T('tier3');
  const kindLabel = r.kind==='cafe'?T('kind_cafe'):T('kind_soup');
  const d = r._d!=null? r._d : dist((origin||CENTER_SEONGSU)[0],(origin||CENTER_SEONGSU)[1],r.lat,r.lng);
  const dtxt = d<1000? Math.round(d)+'m' : (d/1000).toFixed(1)+'km';
  const commHtml = r.community? `<span class="fc-comm">${T('comm')}</span>` : '';
  const poi=AREAS.find(a=>a.cd===r.poi);
  const crowdHtml = poi? `<div class="fc2-crowd"><i style="background:${LVC[poi.lv]}"></i>${TP(poi.nm)} · ${T('now')} ${lvText(poi.lv)} ${(poi.mx||0).toLocaleString()}${lang===0?'':' '}${T('people')}</div>` : '';
  const askHtml=askBlockHtml(r);
  const alcHtml = r.alc? `<div class="fc-alc">${T('alc')}</div>` : '';
  const nm=encodeURIComponent(r.nm);
  return `<div class="fc2" data-lat="${r.lat}" data-lng="${r.lng}">
    ${tilesHtml}
    <div class="fc2-top2">${storeNameHtml(r.nm,'fc2-nm')}<span class="fc2-d">${dtxt}</span></div>
    <div class="fc2-tierrow"><span class="dot" style="background:${tierColor};color:${tierColor}"></span>${tierLabel} · ${kindLabel}${commHtml}</div>
    ${crowdHtml}
    ${askHtml}${alcHtml}
    <div class="fc2-foot"><a class="fc-map" href="https://map.naver.com/p/search/${nm}" target="_blank" rel="noopener">${T('maplink')} ↗</a></div>
  </div>`;
}
function foodMarkers(list){
  if(!HAS_MAP) return;
  mkLayer.clearLayers();
  list.forEach(r=>{
    const color = r.tier===1?'var(--lv1)':r.tier===2?'var(--lv2)':'var(--dim)';
    const ic=L.divIcon({className:'',iconSize:[12,12],html:
      `<div class="mk" style="color:${color};width:12px;height:12px">
        <div class="core" style="width:12px;height:12px;background:${color}"></div></div>`});
    const m=L.marker([r.lat,r.lng],{icon:ic}).addTo(mkLayer);
    m.on('click',()=>{ map.setView([r.lat,r.lng],17,{animate:true}); });
  });
}
function renderFoodList(){
  const l=foodSorted();
  const fl=$('#foodlist');
  if(!l.length){
    fl.innerHTML=`<div class="note" style="padding:26px 12px;text-align:center">${T('empty')}</div>`;
    if(HAS_MAP) mkLayer.clearLayers();
    return;
  }
  const shown=l.slice(0,foodShowN);
  let html=shown.map(foodCard2Html).join('');
  if(l.length>foodShowN){
    const n=l.length-foodShowN;
    const moreLabel = lang===0? `+ 더보기 (${n}곳 남음)` : `+ ${n} ${T('left')}`;
    html+=`<div class="nearby" style="padding:2px 2px 6px"><button id="food-more2">${moreLabel}</button></div>`;
  }
  fl.innerHTML=html;
  fl.querySelectorAll('.fc2').forEach(el=>{
    el.addEventListener('click',(e)=>{
      if(e.target.closest('.fc-map')) return;
      if(!HAS_MAP) return;
      map.setView([parseFloat(el.dataset.lat),parseFloat(el.dataset.lng)],17,{animate:true});
    });
  });
  const mb=$('#food-more2');
  if(mb) mb.onclick=()=>{ foodShowN+=20; renderFoodList(); };
  foodMarkers(l);
}
function setListMode(m){
  listMode=m;
  const isFood = m==='food';
  $('#modeseg').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.m===m));

}

/* ---- 목록 ---- */
function sortList(){
  let l=AREAS.slice();
  if(foodOnly) l=l.filter(a=>FOOD.byPoi[a.cd]);
  if(origin) l.forEach(a=>a.d=dist(origin[0],origin[1],a.lat,a.lng));
  if(sortMode==='busy') l.sort((a,b)=>b.lv-a.lv||(b.mx||0)-(a.mx||0));
  else if(sortMode==='calm') l.sort((a,b)=>a.lv-b.lv||(a.mx||0)-(b.mx||0));
  else l.sort((a,b)=>a.d-b.d);
  return l;
}
function render(){
  const l=sortList(), ul=$('#arealist'); ul.innerHTML='';
  l.forEach(a=>{
    const d=document.createElement('div'); d.className='row';
    const food=FOOD.byPoi[a.cd];
    const foodBadge = food? `<span class="foodbadge">🍽 ${food.n}</span>` : '';
    d.innerHTML=`<span class="dot" style="background:${LVC[a.lv]};color:${LVC[a.lv]}"></span>
      <div class="nm">${a.nm}<small>${a.cat} · 지금 ${(a.mx||0).toLocaleString()}명</small></div>

      ${a.d!=null?`<span class="km">${a.d<1000?Math.round(a.d)+'m':(a.d/1000).toFixed(1)+'km'}</span>`:''}
      <span class="lv" style="background:${LVC[a.lv]}22;color:${LVC[a.lv]}">${lvText(a.lv)}</span>`;
    d.onclick=()=>open_(a); ul.appendChild(d);

  const c2=$('#chips2'); c2.innerHTML='';

  markers(l);
  const busiest=AREAS.slice().sort((x,y)=>(y.mx||0)-(x.mx||0))[0];

  $('#wx').textContent = (busiest.temp!=null?busiest.temp+'°C · ':'') + _busy + busiest.nm;

/* ---- 상세 ---- */
function open_(a){
  cur=a;
  $('#d-nm').textContent=a.nm; $('#d-cat').textContent=a.cat;
  const bd=$('#d-badge'); bd.style.color=LVC[a.lv];
  bd.lastElementChild.textContent=lvText(a.lv);
  $('#d-msg').innerHTML=`지금 이곳은 <b>${LV[a.lv]}</b> 상태예요. 실시간 추정 인원은 <b>${(a.mn||0).toLocaleString()}~${(a.mx||0).toLocaleString()}명</b>입니다.`;
  // 최적 방문 시간
  let best=-1,bl=9;
  a.fc.forEach((v,i)=>{ if(v<bl){bl=v;best=i;} });
  const bh=(DATA.startHour+best)%24;
  $('#besttime').innerHTML=`<span class="bt">앞으로 12시간 중 <b>${bh}시쯤</b>이 가장 한산해요 — 예상 <b>${LV[bl]}</b>.</span>`;
  drawChart(a);
  $('#c-ppl').innerHTML=(a.mx||0).toLocaleString()+'<small>명</small>';
  $('#c-road').innerHTML=(a.road!=null?ROAD[a.road]:'–');
  const nr=a.nres!=null?a.nres:0;
  $('#v-bar').innerHTML=`<div style="width:${nr}%;background:var(--lv1)"></div><div style="width:${100-nr}%;background:rgba(148,197,255,.2)"></div>`;
  $('#v-non').textContent=nr+'%'; $('#v-res').textContent=(100-nr).toFixed(1)+'%';
  const ml=a.male!=null?a.male:50;
  $('#g-bar').innerHTML=`<div style="width:${ml}%;background:var(--acc)"></div><div style="width:${100-ml}%;background:var(--acc2)"></div>`;
  $('#g-m').textContent=ml+'%'; $('#g-f').textContent=(100-ml).toFixed(1)+'%';
  const near=AREAS.filter(x=>x!==a).map(x=>({x,d:dist(a.lat,a.lng,x.lat,x.lng)}))
    .sort((p,q)=>p.d-q.d).slice(0,6);
  const nb=$('#nearby'); nb.innerHTML='';
  near.forEach(({x,d})=>{const b=document.createElement('button');
    b.innerHTML=`<i style="background:${LVC[x.lv]}"></i>${x.nm} <small>${(d/1000).toFixed(1)}km</small>`;
    b.onclick=()=>open_(x); nb.appendChild(b);});
  const nm=encodeURIComponent(a.nm);
  $('#ln').href='https://map.naver.com/p/search/'+nm;
  $('#lk').href='https://map.kakao.com/?q='+nm;
  $('#lt').href='https://www.google.com/maps/search/?api=1&query='+nm;
  renderFoodSection(a);
  $('#d-note').textContent='인파 데이터: 서울 열린데이터광장 실시간 도시데이터 · '+DATA.fetchedAt.slice(0,16).replace('T',' ')+' 기준';
  $('#drawer').classList.add('open');
  if(HAS_MAP) map.setView([a.lat,a.lng],14,{animate:true});
}
function drawChart(a){
  const w=340,h=150,pad=16, n=a.fc.length;
  const mx=Math.max(...a.fc,1);
  let bars='';
  a.fc.forEach((v,i)=>{
    const bw=(w-pad*2)/n-3, x=pad+i*((w-pad*2)/n), bh=Math.max(4,(v+1)/4*(h-46));
    bars+=`<rect x="${x}" y="${h-24-bh}" width="${bw}" height="${bh}" rx="4" fill="${LVC[v]}" opacity=".9"/>`;
    if(i%2===0) bars+=`<text x="${x+bw/2}" y="${h-8}" fill="var(--dim)" font-size="9" text-anchor="middle">${(DATA.startHour+i)%24}</text>`;
  });
  $('#chart').innerHTML=bars;
  $('#cap-l').textContent='앞으로 12시간';
  $('#cap-r').textContent=T('now')+' '+lvText(a.lv);
}

function doSearch(){
  const q=$('#q').value.trim();
  if(!q){ toast('주소나 동네 이름을 입력해 주세요'); return; }
  const hit=AREAS.find(a=>a.nm.replace(/\s/g,'').includes(q.replace(/\s/g,'')));
  if(hit){ setOrigin([hit.lat,hit.lng], hit.nm); return; }
  if(navigator.geolocation){
    $('#search-note').innerHTML='주소를 찾지 못했어요. <b>현재 위치</b>로 시도합니다…';
    navigator.geolocation.getCurrentPosition(
      p=>setOrigin([p.coords.latitude,p.coords.longitude],'현재 위치'),
      ()=>{ $('#search-note').innerHTML='위치를 찾지 못했습니다. 명소 이름으로 검색해 보세요.'; });
  }else toast('검색 결과가 없습니다');
}

/* ---- 라이브 ---- */
async function live(manual){
  if(!WORKER_BASE){ if(manual) toast('Worker 미배포 — 스냅샷을 보고 있어요'); return; }
  try{
    const r=await fetch(WORKER_BASE+'/citydata/all');
    const j=await r.json();
    if(j.areas?.length){ /* 동일 스키마로 교체 */ AREAS=j.areas; DATA.fetchedAt=j.fetchedAt;
      stamp(); render(); if(listMode==='food') renderFoodList(); toast('최신 인파로 갱신했어요'); }
  }catch(e){ if(manual) toast('갱신에 실패했습니다'); }
}
function stamp(){
  const d=new Date(DATA.fetchedAt);
  $('#stamp').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
document.querySelectorAll('#city-switch .cs').forEach(b=>b.onclick=()=>{
  if(b.dataset.city!=='seoul'){ toast(b.textContent+'은 아직 준비 중이에요'); return; }});

stamp();
applyI18n();
setListMode('food');
if(window.innerWidth<=860) $('#drawer').classList.remove('open');
live(false);
</script></body></html>
