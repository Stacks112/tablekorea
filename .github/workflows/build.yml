name: Build static pages

on:
  push:
    branches: [main]
    paths:
      - "data/places.json"
      - "scripts/sync_data.py"
      - "scripts/build_pages.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync data into index.html
        run: python3 scripts/sync_data.py

      - name: Build place pages + sitemap
        run: python3 scripts/build_pages.py

      - name: Commit generated files (rebase-retry loop)
        run: |
          git config user.name "tablekorea-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html p/ sitemap.xml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "build: regenerate place pages + sitemap [skip ci]"
          # push-rejection rebase retry loop (verified pattern from Stacks —
          # do NOT replace with a concurrency group; those cancel queued runs)
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase
          done
          echo "push failed after 5 attempts" >&2
          exit 1
